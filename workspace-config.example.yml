# Copy this file to workspace-config.yml at the repo root before validating or deploying.
# Private downstream repos may commit workspace-config.yml if team policy allows.
# Public repos should keep real organization-specific Databricks values out of committed config.
# Local CLI commands read workspace-config.yml from the repo root.
# Databricks Jobs read the deployed copy at ${workspace.file_path}/workspace-config.yml.

# `tool_provider_type` controls which provider the runtime uses to discover tools for the agent.
# `llm_endpoint_name` is the model endpoint used during runtime execution.
tool_provider_type: local_python
llm_endpoint_name: your-llm-endpoint-name
agent_system_prompt_path: src/databricks_mcp_agent_hello_world/prompts/agent_system_prompt.txt
max_agent_steps: 8
log_level: INFO
databricks_config_profile: DEFAULT
workspace_host: null

# To use one Databricks MCP server instead of the built-in local Python tools:
# tool_provider_type: databricks_mcp
# databricks_mcp_server:
#   name: uc_functions
#   url: https://<workspace-hostname>/api/2.0/mcp/functions/<catalog>/<schema>

storage:
  # One canonical event store backs both local JSONL and Databricks Delta persistence.
  # On Databricks compute, the runtime appends event rows to this Delta table.
  agent_events_table: main.agent_demo.agent_events
  # Local runs fall back to JSONL event logs here when Spark is unavailable.
  local_data_dir: ./.local_state
