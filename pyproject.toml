[project]
name = "databricks_tool_agent_template"
dynamic = ["version"]
description = "Databricks-only, non-interactive LLM agent template with local Python and optional Databricks MCP tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "databricks-sdk==0.116.0",
  "databricks-openai==0.16.0",
  "jsonschema==4.26.0",
  "pydantic==2.13.4",
  "pyarrow==24.0.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.13.5",
  "pytest>=8.3.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.8.0",
  "build>=1.2.0",
  "hatch-vcs>=0.5.0",
  "pre-commit>=4.0.0",
  "nox>=2024.4.15",
]

[project.scripts]
preflight = "databricks_tool_agent_template.cli:preflight_entrypoint"
discover-tools = "databricks_tool_agent_template.cli:discover_tools_entrypoint"
run-agent-task = "databricks_tool_agent_template.cli:run_agent_task_entrypoint"
run-evals = "databricks_tool_agent_template.cli:run_evals_entrypoint"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"

[tool.hatch.version.raw-options]
local_scheme = "node-and-date"

[tool.hatch.build.targets.wheel]
packages = ["src/databricks_tool_agent_template"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "PT", "RUF"]

[tool.pymarkdown]
plugins.line-length.enabled = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: fast isolated tests",
  "contract: cross-module tests that validate repo wiring and behavior contracts",
]

[tool.coverage.run]
branch = true
source = ["src/databricks_tool_agent_template"]
relative_files = true

[tool.coverage.html]
show_contexts = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.coverage.paths]
source = [
  "src/databricks_tool_agent_template",
  "*/site-packages/databricks_tool_agent_template",
]
